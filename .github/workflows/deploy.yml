name: Deploy Frontend to EC2

on:
  push:
    branches: [ "deploy" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY:$IMAGE_TAG .
          docker push $ECR_REGISTRY:$IMAGE_TAG

      - name: Deploy Frontend to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 20m
          command_timeout: 20m
          script: |
            # Login ECR
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | sudo docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}

            # Descargar nueva imagen
            sudo docker pull ${{ secrets.ECR_REGISTRY }}:${{ github.sha }}

            # Detener contenedor antiguo
            sudo docker stop innovatech-frontend || true
            sudo docker rm innovatech-frontend || true

            # Levantar nuevo contenedor
            sudo docker run -d \
              --name innovatech-frontend \
              --restart unless-stopped \
              -p 80:8080 \
              ${{ secrets.ECR_REGISTRY }}:${{ github.sha }}

            # Limpiar imágenes viejas
            sudo docker image prune -f